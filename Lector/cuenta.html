<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualLibro-Cuenta-de-Lector</title>
    <link rel="stylesheet" href="cssLector/estilosCuenta.css">
</head>
<body>
    <div class="contenedorPrincipal">
        <header>
            <h1>Mi Cuenta</h1>
        </header>

        <nav>
            <div class="perfil-container">
                <div class="foto-perfil">👤</div>
                <div class="info-usuario">
                    <h2 id="nombreUsuario">*Nombre del usuario*</h2>
                    <p><strong>Rol:</strong> <span id="rolUsuario">Lector</span></p>
                </div>
            </div>
        </nav>

        <main>
            <h1>Cambiar Rol</h1>

            <div class="toggle-container">
                <div class="toggle-switch" id="rolToggle">
                    <div class="toggle-slider">Lector</div>
                    <div class="toggle-label">Lector / Escritor</div>
                </div>
            </div>

            <div class="biblioteca-section">
                <h2>📚 Biblioteca Personal</h2>
                <div class="libros-grid" id="librosGrid">
                    <!-- Los libros se cargarán aquí dinámicamente -->
                </div>
            </div>
        </main>

        <footer>
            <nav>
                <li><a href="InicioLector.html">Inicio</a></li>
                <li><a href="BuscarLector.html">Buscar</a></li>
                <li><a href="Correo.html">Correo</a></li>
                <li><a href="cuenta.html">Cuenta</a></li>
            </nav>
        </footer>
    </div>

    <script src="lector.js"></script>
    <script>
        // ========================================
        // PERFIL DE USUARIO - LECTOR
        // ========================================

        let usuarioActual = null;

        // ========================================
        // FUNCIÓN: Cargar datos del usuario
        // ========================================
        async function cargarUsuario() {
            const usuario = await verificarAutenticacion();
            if (!usuario) return;

            usuarioActual = usuario;

            // Mostrar información del usuario
            document.getElementById('nombreUsuario').textContent = usuario.nombre;
            document.getElementById('rolUsuario').textContent = usuario.rol.charAt(0).toUpperCase() + usuario.rol.slice(1);

            // Configurar toggle según rol actual
            const toggle = document.getElementById('rolToggle');
            const slider = toggle.querySelector('.toggle-slider');

            if (usuario.rol === 'escritor') {
                toggle.classList.add('active');
                slider.textContent = 'Escritor';
            } else {
                toggle.classList.remove('active');
                slider.textContent = 'Lector';
            }

            // Cargar biblioteca personal
            await cargarBiblioteca();
        }

        // ========================================
        // FUNCIÓN: Cargar biblioteca personal
        // ========================================
        async function cargarBiblioteca() {
            const librosGrid = document.getElementById('librosGrid');
            librosGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px;">Cargando biblioteca...</div>';

            const libros = await cargarBibliotecaPersonal();

            librosGrid.innerHTML = ''; // Limpia la galería

            if (libros.length === 0) {
                librosGrid.innerHTML = '<div class="biblioteca-vacia">No tienes libros guardados aún</div>';
                return;
            }

            // Recorrer cada libro y crear su tarjeta
            libros.forEach(libro => {
                const libroCard = document.createElement('div');
                libroCard.className = 'libro-card';
                libroCard.innerHTML = `
                    <div class="libro-icono">📖</div>
                    <h3>${libro.titulo}</h3>
                    <p class="autor">${libro.autor}</p>
                    <p class="genero">${libro.genero}</p>
                    <p class="fecha">Guardado: ${formatearFecha(libro.fecha_guardado)}</p>
                    <button class="btn-leer" data-id="${libro.id}">Leer</button>
                    <button class="btn-quitar" data-id="${libro.id}">Quitar</button>
                `;
                librosGrid.appendChild(libroCard);
            });
        }

        // ========================================
        // EVENT LISTENER: Cambio de rol (Toggle)
        // ========================================
        document.getElementById('rolToggle').addEventListener('click', async function() {
            if (!usuarioActual) return;

            const toggle = this;
            const slider = toggle.querySelector('.toggle-slider');
            const nuevoRol = toggle.classList.contains('active') ? 'lector' : 'escritor';

            // Mostrar confirmación
            const confirmar = confirm(`¿Estás seguro de que quieres cambiar tu rol a ${nuevoRol.charAt(0).toUpperCase() + nuevoRol.slice(1)}?`);

            if (!confirmar) return;

            // Deshabilitar toggle durante la operación
            toggle.style.pointerEvents = 'none';

            const resultado = await cambiarRolUsuario(nuevoRol);

            if (resultado.success) {
                mostrarMensaje(`Rol cambiado exitosamente a ${nuevoRol.charAt(0).toUpperCase() + nuevoRol.slice(1)}`, 'success');

                // Actualizar estado local
                usuarioActual.rol = nuevoRol;
                localStorage.setItem('userData', JSON.stringify(usuarioActual));

                // Redirigir después de un delay
                setTimeout(() => {
                    if (nuevoRol === 'escritor') {
                        window.location.href = '../Escritor/cuenta.html';
                    } else {
                        window.location.reload();
                    }
                }, 1500);
            } else {
                mostrarMensaje(resultado.message || 'Error al cambiar rol', 'error');
                // Revertir toggle
                toggle.classList.toggle('active');
            }

            // Rehabilitar toggle
            toggle.style.pointerEvents = 'auto';
        });

        // ========================================
        // EVENT LISTENER: Acciones de libros
        // ========================================
        document.addEventListener('click', async function(event) {
            const btnLeer = event.target.closest('.btn-leer');
            const btnQuitar = event.target.closest('.btn-quitar');

            if (btnLeer) {
                const libroId = btnLeer.dataset.id;
                if (libroId) {
                    window.location.href = `lectura.html?bookId=${libroId}`;
                }
            }

            if (btnQuitar) {
                const libroId = btnQuitar.dataset.id;
                if (libroId) {
                    const confirmar = confirm('¿Estás seguro de que quieres quitar este libro de tu biblioteca?');
                    if (!confirmar) return;

                    const resultado = await quitarDeBiblioteca(libroId);
                    if (resultado.success) {
                        mostrarMensaje('Libro removido de tu biblioteca', 'success');
                        await cargarBiblioteca(); // Recargar biblioteca
                    } else {
                        mostrarMensaje(resultado.message || 'Error al quitar libro', 'error');
                    }
                }
            }
        });

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        document.addEventListener('DOMContentLoaded', cargarUsuario);
    </script>
</body>
